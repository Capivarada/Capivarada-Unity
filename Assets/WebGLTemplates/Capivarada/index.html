<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #191718; }
    #unity-container { width: 100%; height: 100%; display: grid; place-items: center; }
    #unity-canvas { width: 100%; height: 100%; background: #191718; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; background: #191718; color: #fff7ed; font: 700 16px Arial, sans-serif; text-align: center; }
    #loading-bar { width: min(320px, 75vw); height: 8px; overflow: hidden; border: 1px solid #554c50; border-radius: 99px; background: #231f20; }
    #loading-progress { width: 0; height: 100%; background: #f2622a; transition: width .16s ease; }
    #error { display: none; max-width: 560px; padding: 14px; color: #fff7ed; background: #6d2b2b; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading">
    <div>CARREGANDO CAPIVARADA</div>
    <div id="loading-bar"><div id="loading-progress"></div></div>
    <div id="error"></div>
  </div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#loading');
    const progress = document.querySelector('#loading-progress');
    const error = document.querySelector('#error');
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
      #if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
      #endif
      #if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
      #endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: '{{{ COMPANY_NAME }}}',
      productName: '{{{ PRODUCT_NAME }}}',
      productVersion: '{{{ PRODUCT_VERSION }}}'
    };
    const loader = document.createElement('script');
    loader.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, value => {
      progress.style.width = (value * 100) + '%';
    }).then(() => {
      loading.remove();
    }).catch(message => {
      error.textContent = message;
      error.style.display = 'block';
    });
    document.body.appendChild(loader);
  </script>
</body>
</html>
